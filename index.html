<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calcio Hub">
<meta name="theme-color" content="#070d1c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Calcio Hub 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Layout: colonna di loghi a sinistra, contenuto in fogli continui con fasce colorate
   per competizione, barra sezioni in basso. Su iPad e in orizzontale tutto si allarga. */
:root{
  --bg:#070d1c;
  --sheet:rgba(14,24,48,.74); --sheet-hi:rgba(255,255,255,.035);
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.16);
  --fg:#f2f6fd; --fg2:#c9d6ea; --mute:#8aa0c2;
  --sky:#38bdf8; --blue:#2f6bff; --gold:#ffc94d; --live:#2ee66b;
  --c-blue:#4cc3ff; --c-gold:#ffc94d; --c-green:#2ee6a6; --c-orange:#ff9a3d; --c-purple:#b98bff;
  --z-cl:#3d8bff; --z-clq:#7ab4ff; --z-el:#ff9a1f; --z-conf:#22d39a; --z-rel:#ff5470; --z-promo:#3ddc84; --z-po:#b48cff; --z-pout:#ff7ac6;
  --f-num:"Barlow Semi Condensed","SF Pro Display",-apple-system,system-ui,sans-serif;
  --f-body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --rail:68px; --tab:70px; --r:20px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(70% 45% at 0% 0%, rgba(47,107,255,.55) 0%, transparent 70%),
    radial-gradient(60% 40% at 100% 12%, rgba(139,61,255,.42) 0%, transparent 70%),
    radial-gradient(70% 45% at 85% 100%, rgba(6,182,212,.30) 0%, transparent 70%),
    radial-gradient(50% 35% at 0% 85%, rgba(255,77,140,.16) 0%, transparent 70%),
    linear-gradient(180deg,#0a1430 0%,#070d1c 60%);
  background-attachment:fixed;
  color:var(--fg); font:15px/1.35 var(--f-body); -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:12px}
img{max-width:100%}
.app{position:fixed;inset:0;display:grid;grid-template-columns:calc(var(--rail) + env(safe-area-inset-left,0px)) 1fr}

/* ---------- Stemmi: luce morbida dietro, contorno luminoso sottile, colori intatti ---------- */
.crest{width:28px;height:28px;object-fit:contain;flex:none;
  filter:drop-shadow(0 0 .7px rgba(255,255,255,.95)) drop-shadow(0 0 5px rgba(255,255,255,.22)) drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.crest.ph{display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.12);font:700 11px var(--f-num);color:var(--fg2);filter:none}
.spot{display:grid;place-items:center;flex:none;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.30) 0%,rgba(255,255,255,.10) 45%,rgba(255,255,255,0) 70%)}

/* ---------- Colonna loghi ---------- */
.rail{padding:calc(env(safe-area-inset-top,0px) + 12px) 0 calc(var(--tab) + env(safe-area-inset-bottom,0px) + 12px) env(safe-area-inset-left,0px);
  overflow-y:auto;scrollbar-width:none;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border-right:1px solid var(--line);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.rail::-webkit-scrollbar{display:none}
.rail-inner{display:flex;flex-direction:column;align-items:center;gap:7px}
.rail .sep{width:30px;height:1px;background:var(--line2);margin:6px 0}
.rail .lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.lg{display:flex;align-items:center;gap:10px;padding:3px;border-radius:18px;width:max-content}
.lg .nm{display:none;font-size:14px;font-weight:600;color:var(--fg2);white-space:nowrap}
.medal{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,rgba(255,255,255,.20),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.4),inset 0 -3px 8px rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.35);
  -webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);transition:transform .15s,box-shadow .2s}
.lg:active .medal{transform:scale(.93)}
.medal img{width:66%;height:66%;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.medal .ini{font:700 15px var(--f-num);color:var(--fg2)}
.lp{display:flex;flex-direction:column;align-items:center;line-height:1}
.lp b{font:800 19px var(--f-num);color:#5cb6ff}
.lp span{font-size:6px;font-weight:800;letter-spacing:.06em;margin-top:2px;color:var(--fg2)}
.medal.all svg{width:23px;height:23px;color:var(--c-blue)}
.lg[aria-current="true"] .medal{border-color:rgba(255,255,255,.6);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 0 0 3px color-mix(in srgb,var(--lc,#4cc3ff) 55%,transparent),0 6px 16px rgba(0,0,0,.4)}
.lg[aria-current="true"] .nm{color:var(--fg)}

/* ---------- Contenuto ---------- */
.main{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(var(--tab) + env(safe-area-inset-bottom,0px) + 26px) 16px}
.inner{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:12px}
.top .tlogo{width:44px;height:44px}
.top .tlogo img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.top .tt{flex:1;min-width:0}
.top h1{font:800 29px/1.02 var(--f-num);letter-spacing:.01em;margin:0;text-wrap:balance}
.top .sub{color:var(--mute);font-size:12.5px;margin-top:3px}
.iconbtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 8px rgba(0,0,0,.35)}
.iconbtn svg{width:19px;height:19px;color:var(--fg2)}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Pulsanti in rilievo (giorni, selettori) */
.press{background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.38),0 1px 1px rgba(0,0,0,.4);
  transition:transform .12s,box-shadow .12s,background .2s}
.press:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 3px rgba(0,0,0,.4)}
.press[aria-current="true"]{background:linear-gradient(180deg,#4fa9ff 0%,#2563ff 100%);border-color:rgba(255,255,255,.38);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,30,120,.35),0 5px 16px rgba(37,99,255,.55)}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 10px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;min-width:60px;padding:7px 10px 8px;border-radius:15px;text-align:center}
.day span{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:600}
.day b{display:block;font:700 18px/1.1 var(--f-num)}
.day[aria-current="true"] span{color:rgba(255,255,255,.85)}
.seg{display:inline-flex;gap:6px;padding:4px;border-radius:15px;background:rgba(0,0,0,.25);border:1px solid var(--line);align-self:flex-start}
.seg button{padding:7px 18px;border-radius:11px;font-weight:700;font-size:14px;color:var(--fg2)}

/* Foglio unico: le competizioni sono fasce dentro lo stesso pannello */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%)}
.band{display:flex;align-items:center;gap:11px;padding:11px 14px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--lc) 42%,transparent) 0%,color-mix(in srgb,var(--lc) 12%,transparent) 55%,transparent 100%);
  border-top:1px solid var(--line)}
.sheet > .band:first-child,.sheet > section:first-child > .band{border-top:0}
.band .spot{width:40px;height:40px}
.band .spot img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.band h2{font:700 17px var(--f-num);letter-spacing:.03em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .count{font-size:12px;color:var(--fg2);opacity:.8}

/* Riga partita */
.rows{display:grid}
.m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.rows .m:first-child{border-top:0}
.m .t{display:flex;align-items:center;gap:8px;min-width:0}
.m .t.h{justify-content:flex-end;text-align:right}
.m .t span{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.m .t.lose span{color:var(--mute)}
.m .spot{width:38px;height:38px}
.ita span{color:var(--gold)!important}
.mid{min-width:66px;text-align:center}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:62px;padding:5px 10px;border-radius:12px;
  font:700 18px var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pill.pre{background:rgba(76,195,255,.12);border:1px solid rgba(76,195,255,.32);color:#bfe9ff;font-weight:600}
.pill.post{background:rgba(255,255,255,.12);border:1px solid var(--line2)}
.pill.in{background:rgba(46,230,107,.16);border:1px solid rgba(46,230,107,.6);color:#d8ffe6;box-shadow:0 0 14px rgba(46,230,107,.25)}
.st{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:3px}
.st.live{color:var(--live);font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);display:inline-block;box-shadow:0 0 0 0 rgba(46,230,107,.7);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,230,107,.7)}70%{box-shadow:0 0 0 7px rgba(46,230,107,0)}100%{box-shadow:0 0 0 0 rgba(46,230,107,0)}}
.xb{display:inline-block;margin-top:4px;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.xb.sup{background:rgba(255,154,61,.18);color:#ffc996;box-shadow:inset 0 0 0 1px rgba(255,154,61,.45)}
.xb.rig{background:rgba(255,201,77,.18);color:#ffe29a;box-shadow:inset 0 0 0 1px rgba(255,201,77,.5)}
.m{cursor:pointer;transition:background .15s}
.m:active{background:rgba(255,255,255,.05)}
.card{cursor:pointer}

/* Le mie squadre */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:5px 15px 5px 6px;border-radius:999px;font-weight:700}
.chip .crest{width:26px;height:26px}
.chip[aria-current="true"]{background:linear-gradient(180deg,#ffd978 0%,#f0a92a 100%);color:#2a1a00;border-color:rgba(255,255,255,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 5px 16px rgba(240,169,42,.45)}
.cards{display:grid;gap:12px}
.card{position:relative;border-radius:22px;padding:14px 14px 16px;overflow:hidden;
  background:linear-gradient(165deg,rgba(255,255,255,.10),rgba(255,255,255,.03)),var(--sheet);border:1px solid var(--line2);
  box-shadow:0 14px 30px rgba(0,0,0,.32);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.38;
  background:radial-gradient(55% 85% at 0% 55%,var(--hc,transparent),transparent 72%),radial-gradient(55% 85% at 100% 55%,var(--ac,transparent),transparent 72%)}
.card .comp{position:relative;display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg);font-weight:700}
.card .comp img{width:22px;height:22px;object-fit:contain}
.card .comp .when{margin-left:auto;color:var(--fg2);letter-spacing:.06em;font-weight:600}
.card .body{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:12px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
.side .spot{width:76px;height:76px}
.side .spot .crest{width:54px;height:54px}
.side b{font-size:14px;font-weight:600;line-height:1.2;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.side.me b{color:var(--fg)} .side:not(.me) b{color:var(--fg2)}
.center{text-align:center;min-width:94px}
.center .big{font:800 36px/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.center .date{font:700 13px var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin-bottom:4px}
.tag{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.12);color:var(--fg2)}
.tag.w{background:rgba(46,230,166,.18);color:#b6f8df} .tag.l{background:rgba(255,84,112,.18);color:#ffd0d8} .tag.live{background:rgba(46,230,107,.18);color:#d8ffe6}
.card .foot{position:relative;margin-top:12px;font-size:12px;color:var(--mute);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u23d{font:700 12px var(--f-num);letter-spacing:.03em;color:var(--fg2);padding:12px 16px 0;display:flex;justify-content:space-between}
.u23d span{color:var(--mute);font-weight:600}
.seclbl{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin:4px 2px -4px}

/* Classifica */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700;padding:9px 6px;text-align:center;background:rgba(0,0,0,.18)}
th.l,td.l{text-align:left}
td{padding:8px 6px;border-top:1px solid var(--line);text-align:center;font-size:14px;color:var(--fg2)}
td.pos{width:44px;padding-left:12px}
.rk{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 4px;border-radius:8px;font:700 14px var(--f-num);color:var(--fg)}
.rk.z{background:color-mix(in srgb,var(--zc) 24%,transparent);color:color-mix(in srgb,var(--zc) 60%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--zc) 55%,transparent)}
.tm{display:flex;align-items:center;gap:9px;min-width:0}
.tm .spot{width:36px;height:36px;margin:-4px 0}
.tm .crest{width:24px;height:24px}
tr[data-cal]{cursor:pointer}
tr[data-cal]:active td{background:rgba(255,255,255,.05)}
.tm span{font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
td.pts{font:800 17px var(--f-num);color:var(--fg);padding-right:12px}
td.dr.p{color:#9ff2cf} td.dr.n{color:#ffb3c0}
tr.fav td{background:rgba(255,201,77,.09)}
tr.fav .tm span{color:var(--gold)}
.x{display:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;padding:11px 14px 14px;font-size:12px;color:var(--fg2);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Marcatori */
.pl{display:grid;grid-template-columns:34px auto 1fr auto;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.rows .pl:first-child{border-top:0}
.pl .n{font:700 16px var(--f-num);color:var(--mute);text-align:center}
.pl .n.g1,.pl .n.g2,.pl .n.g3{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#1c1300;justify-self:center}
.pl .n.g1{background:linear-gradient(180deg,#ffe08a,#e9a91f);box-shadow:0 3px 10px rgba(233,169,31,.45)}
.pl .n.g2{background:linear-gradient(180deg,#f1f5fb,#a9b6c8)}
.pl .n.g3{background:linear-gradient(180deg,#f3c49b,#b8743f)}
.face{position:relative;width:44px;height:44px}
.face .hs{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.22),rgba(255,255,255,.05));border:1px solid var(--line2)}
.face .hs.ph{display:grid;place-items:center;font:700 14px var(--f-num);color:var(--fg2)}
.face .crest{position:absolute;right:-5px;bottom:-3px;width:20px;height:20px}
.pl .who{min-width:0}
.pl .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .who span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .nums{display:flex;align-items:center;gap:14px;text-align:center}
.pl .nums div{min-width:30px} .pl .nums small{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.pl .nums em{font:600 15px var(--f-num);font-style:normal;color:var(--fg2);font-variant-numeric:tabular-nums}
.pl .val{font:800 24px/1 var(--f-num);color:var(--fg);min-width:34px;font-variant-numeric:tabular-nums}
.pl .val.or{color:var(--c-orange)}
.pl.fav{background:rgba(255,201,77,.08)}

/* Stati */
.empty{padding:30px 18px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.empty .press{margin-top:14px;padding:8px 18px;border-radius:12px;font-weight:700;color:var(--fg)}
.note{font-size:12px;color:var(--mute);padding:0 2px;margin:0}
.skel{height:50px;margin:10px 14px;border-radius:12px;background:linear-gradient(90deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,.11) 50%,rgba(255,255,255,.05) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- Scheda partita ---------- */
body.lock .main{overflow:hidden}
.ov{position:fixed;inset:0;z-index:40;background:rgba(3,7,16,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;justify-content:center;align-items:flex-end;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.ms{position:relative;width:100%;max-width:760px;height:calc(100% - env(safe-area-inset-top,0px) - 14px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  border-radius:26px 26px 0 0;border:1px solid var(--line2);border-bottom:0;
  background:
    radial-gradient(70% 30% at 15% 0%,color-mix(in srgb,var(--hc,#2f6bff) 45%,transparent),transparent 70%),
    radial-gradient(70% 30% at 85% 0%,color-mix(in srgb,var(--ac,#8b3dff) 45%,transparent),transparent 70%),
    linear-gradient(180deg,#0e1a36 0%,#0a1328 100%);
  box-shadow:0 -20px 60px rgba(0,0,0,.5);animation:up .28s cubic-bezier(.2,.8,.2,1);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.ms .grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 8px}
.ms .close{position:absolute;top:14px;right:14px;z-index:2}
.mh{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0 14px}

.cm{min-width:0}
.cc{display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc img{width:13px;height:13px;object-fit:contain}
.cc .nx{color:var(--c-blue);font-weight:800}
.cl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:7px}
.cl .t{display:flex;align-items:center;gap:6px;min-width:0;font-size:13.5px;font-weight:600}
.cl .t.h{justify-content:flex-end;text-align:right}
.cl .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .t.me span{color:var(--fg)} .cl .t:not(.me) span{color:var(--fg2)}
.cl .crest{width:20px;height:20px}
.cl .pill{min-width:50px;padding:3px 7px;font-size:15px}
.res{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;font:800 13px var(--f-num)}
.res.w{background:rgba(46,230,166,.2);color:#b6f8df} .res.d{background:rgba(255,255,255,.12);color:var(--fg2)} .res.l{background:rgba(255,84,112,.2);color:#ffd0d8}
.res.in{background:rgba(46,230,107,.2)}
.sq{display:flex;align-items:center;gap:10px;padding:4px 50px 14px 0}
.sq .ico{color:var(--mute)} .sq .ico svg{width:20px;height:20px}
.sq input{flex:1;min-width:0;font:16px var(--f-body);color:var(--fg);padding:11px 14px;border-radius:14px;border:1px solid var(--line2);background:rgba(0,0,0,.25);outline:none}
.sq input:focus{border-color:rgba(76,195,255,.6);box-shadow:0 0 0 3px rgba(76,195,255,.18)}
.sres{display:flex;align-items:center;gap:11px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.rows .sres:first-child,.sheet > .sres:first-child{border-top:0}
.sres .spot{width:40px;height:40px} .sres .crest{width:28px;height:28px}
.sres .face{width:40px;height:40px} .sres .face .hs{width:40px;height:40px}
.sres .who{flex:1;min-width:0}
.sres .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres .who span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres .val{font:800 18px var(--f-num);color:var(--c-orange)}
.mini{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;color:var(--fg2);background:rgba(255,255,255,.07);border:1px solid var(--line)}
.mini svg{width:18px;height:18px}
.mini.on{color:#ffd978;border-color:rgba(255,201,77,.45);background:rgba(255,201,77,.12)}
.mini.rm{color:#ffb3c0}
.mini[disabled]{opacity:.3}
.fe{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line)}
.fe:first-child{border-top:0}
.fe .spot{width:40px;height:40px} .fe .crest{width:28px;height:28px}
.fe b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


.tseg{margin:0 0 12px;display:flex;width:100%}
.tseg button{flex:1;padding:8px 6px;font-size:13.5px}
.sres .chev{color:var(--mute);font-size:13px;font-weight:600;white-space:nowrap}
.face .jn{position:absolute;right:-6px;bottom:-4px;min-width:20px;height:18px;padding:0 4px;border-radius:7px;display:grid;place-items:center;
  font:700 11px var(--f-num);background:#1d2f57;border:1px solid var(--line2);color:var(--fg)}
.flag{width:16px;height:11px;object-fit:cover;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ph-head{display:flex;align-items:center;gap:14px;padding:4px 50px 14px 0}
.bigface{position:relative;width:84px;height:84px;flex:none}
.bigface .hs{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.25),rgba(255,255,255,.05));border:1px solid var(--line2)}
.bigface .hs.ph{display:grid;place-items:center;font:800 26px var(--f-num);color:var(--fg2)}
.ph-head h1{font:800 26px/1.05 var(--f-num);margin:0}
.phteam{display:inline-flex;align-items:center;gap:7px;margin-top:6px;font-weight:600;color:var(--fg2);cursor:pointer}
.phteam .crest{width:22px;height:22px}
.phteam span::after{content:" ›";color:var(--c-blue)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.facts div{padding:10px 12px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.facts div:nth-child(-n+3){border-top:0} .facts div:nth-child(3n+1){border-left:0}
.facts span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.facts b{display:block;font-weight:600;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:12px 6px}
.tiles b{display:block;font:800 26px var(--f-num);color:var(--fg)}
.tiles div:nth-child(2) b{color:var(--c-orange)}
.tiles span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.pl{cursor:pointer}

/* ---------- Barra sezioni ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(9,16,34,.55),rgba(9,16,34,.9));border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%)}
.tabs-in{display:flex;gap:4px;width:100%;max-width:580px;justify-content:space-around}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0;font-size:11px;font-weight:600;color:var(--mute);position:relative}
.tab .ic{width:44px;height:36px;border-radius:12px;display:grid;place-items:center;transition:background .2s}
.tab .ic svg{width:25px;height:25px;color:var(--tc)}
.tab[aria-current="true"]{color:var(--fg)}
.tab[aria-current="true"] .ic{background:color-mix(in srgb,var(--tc) 24%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tc) 40%,transparent)}
.tab[disabled]{opacity:.42;cursor:default}
.tab .soon{position:absolute;top:-5px;right:calc(50% - 30px);font-size:8px;font-weight:700;padding:1px 5px;border-radius:6px;background:rgba(255,255,255,.14);color:var(--fg2)}

/* ---------- Schermi larghi ---------- */
@media (min-width:600px){
  .x{display:table-cell}
  .tm span{max-width:none}
  .cards{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  .pl .nums .x2{display:block}
}
.pl .nums .x2{display:none}
@media (min-width:600px){ .pl .nums .x2{display:block} }
@media (min-width:900px){
  :root{--rail:214px}
  .rail-inner{align-items:stretch;padding:0 12px}
  .lg{width:auto;padding:5px 10px 5px 5px}
  .lg .nm{display:block}
  .lg[aria-current="true"]{background:rgba(255,255,255,.08)}
  .rail .sep{width:auto;margin:8px 6px}
  .rail .lbl{margin-left:8px}
}
@media (orientation:landscape) and (max-height:500px){
  :root{--tab:56px}
  .tab .lbl{display:none}
  .top h1{font-size:25px}
}
/* ---------- Orizzontale a tutto schermo (classifica e marcatori su iPhone) ---------- */
.railtab{position:fixed;left:0;top:50%;z-index:25;display:grid;place-items:center;
  width:30px;height:86px;padding-left:env(safe-area-inset-left,0px);box-sizing:content-box;border-radius:0 16px 16px 0;color:var(--fg);
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.22);border-left:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 18px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  transform:translate(-110%,-50%);opacity:0;pointer-events:none;transition:transform .9s cubic-bezier(.45,0,.2,1),opacity .6s ease}
.railtab svg{width:18px;height:18px}
.main{grid-column:2;grid-row:1}
.rail{grid-column:1;grid-row:1}
body.land .app{grid-template-columns:0 1fr}
body.land .rail{position:fixed;left:0;top:0;bottom:0;z-index:30;width:calc(var(--rail) + env(safe-area-inset-left,0px));background:rgba(9,16,34,.94);
  transition:transform 1.1s cubic-bezier(.45,0,.2,1),box-shadow .5s ease}
body.land .main{padding-left:calc(var(--rail) + env(safe-area-inset-left,0px) + 14px);padding-right:max(8px,calc(env(safe-area-inset-right,0px) - 26px));
  transition:padding-left 1.1s cubic-bezier(.45,0,.2,1)}
body.land .tabs{transition:transform 1.1s cubic-bezier(.45,0,.2,1)}
body.land .inner{max-width:none}
body.land .ms{max-width:none;border-radius:20px 20px 0 0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body.land .cards{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
body.immersive .rail{transform:translateX(-105%)}
body.immersive.peek .rail{transform:none;box-shadow:14px 0 40px rgba(0,0,0,.55)}
body.immersive .tabs{transform:translateY(110%)}
body.immersive.peek .tabs{transform:none}
body.immersive .railtab{transform:translate(0,-50%);opacity:1;pointer-events:auto}
body.immersive.peek .railtab{transform:translate(-110%,-50%);opacity:0;pointer-events:none}
body.immersive .main{padding-left:max(40px,calc(env(safe-area-inset-left,0px) + 30px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
body.immersive td{font-size:16px;padding:9px 9px}
body.immersive .tm span{font-size:16px}
body.immersive td.pts{font-size:20px}
body.immersive .rk{min-width:30px;height:27px;font-size:16px}
body.immersive .tm .spot{width:42px;height:42px} body.immersive .tm .crest{width:28px;height:28px}
body.immersive th{font-size:11.5px;padding:10px 9px}
body.immersive .fd i{width:11px;height:11px}
body.immersive .top h1{font-size:23px}
/* ---------- Avvio, transizioni, trascina per aggiornare ---------- */
.splash{position:fixed;inset:0;z-index:100;overflow:hidden;background:#070d1c;transition:opacity .65s ease,visibility .65s}
.splash.out{opacity:0;visibility:hidden}
.stage{position:absolute;top:0;right:0;transform-origin:100% 0}
.stage img{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .s2{opacity:0}
.tgt{position:absolute;pointer-events:none}
.sball{position:absolute;left:0;top:0;border-radius:50%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55));will-change:transform;transform:translate(-300px,130vh);z-index:3}
.sball img{display:block;width:100%;height:100%;border-radius:50%;will-change:transform}
.sball i{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 32%),radial-gradient(circle,rgba(0,0,0,0) 58%,rgba(5,12,35,.4) 100%)}
.sring{position:absolute;border-radius:50%;border:4px solid rgba(140,210,255,.9);box-shadow:0 0 30px rgba(120,200,255,.8);opacity:0;pointer-events:none;z-index:2}
.sflash{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(200,235,255,.9),rgba(120,190,255,0) 65%);opacity:0;pointer-events:none;z-index:2}
.stitle{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12%);text-align:center;opacity:0;pointer-events:none;z-index:4}
.splash.land .stitle{bottom:calc(env(safe-area-inset-bottom,0px) + 10%);left:4%;right:auto;text-align:left}
.sname{display:block;white-space:nowrap;font:800 min(17vw,15vh)/1 var(--f-num);letter-spacing:.02em;text-transform:uppercase}
.splash.land .sname{font-size:min(10vw,19vh)}
.lt{display:inline-block;opacity:0;color:#fff;background:linear-gradient(180deg,#ffffff 0%,#d6ecff 55%,#7cc8ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 0 rgba(10,25,70,.9)) drop-shadow(0 10px 22px rgba(0,0,0,.65)) drop-shadow(0 0 18px rgba(76,195,255,.55))}
.lt.sp{width:.28em}
.ssub{display:block;margin-top:10px;opacity:0;font-size:clamp(12px,3.4vw,16px);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#e8f2ff;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.inner.enter{animation:viewin .42s cubic-bezier(.2,.8,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(12px)}}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:45;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.22);box-shadow:0 6px 18px rgba(0,0,0,.45);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);opacity:0;transform:translate(-50%,-12px)}
.ptr svg{width:20px;height:20px;color:var(--c-blue)}
.ptr.ready{border-color:rgba(76,195,255,.7);box-shadow:0 0 0 4px rgba(76,195,255,.18),0 6px 18px rgba(0,0,0,.45)}
.ptr.spin{opacity:1!important;transform:translate(-50%,58px)!important;transition:transform .25s ease}
.ptr.spin svg{animation:spin .9s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  var done=false;
  function finish(){ if(done) return; done=true; sp.classList.add("out"); setTimeout(function(){ if(sp.parentNode) sp.remove(); },700); }
  sp.addEventListener("click",finish);
  setTimeout(finish, 7000);
  var started=false;
  addEventListener("resize", function(){ if(started && !done) finish(); });   // in ogni caso l'app si apre
  var stage=sp.querySelector(".stage"), i1=stage.querySelector(".s1"), i2=stage.querySelector(".s2"), tgt=stage.querySelector(".tgt"),
      ball=sp.querySelector(".sball"), img=ball.querySelector("img"), ring=sp.querySelector(".sring"), flash=sp.querySelector(".sflash"),
      title=sp.querySelector(".stitle"), sub=sp.querySelector(".ssub"), lts=[].slice.call(sp.querySelectorAll(".lt"));
  function size(){ return { w: document.documentElement.clientWidth || innerWidth, h: document.documentElement.clientHeight || innerHeight }; }
  var V=size(), K=null, g=null, tries=0;
  function orient(){ var v=size(); return v.w>v.h ? "l" : "p"; }
  function setScene(k){
    K=k; g=G[K]; i1.src=IM[K][0]; i2.src=IM[K][1];
    sp.classList.remove("land","port"); sp.classList.add(K==="l" ? "land" : "port");
  }
  function layout(){
    V=size();
    var sc=Math.max(V.w/g.W, V.h/g.H);
    stage.style.width=g.W+"px"; stage.style.height=g.H+"px"; stage.style.transform="scale("+sc+")";
    tgt.style.cssText="left:"+(g.tx-g.r)+"px;top:"+(g.ty-g.r)+"px;width:"+(2*g.r)+"px;height:"+(2*g.r)+"px";
    var r=tgt.getBoundingClientRect();          // misura reale dell'incrocio sullo schermo
    return { x:r.left+r.width/2, y:r.top+r.height/2, R:r.width/2 };
  }
  function ready(im){ return im.decode ? im.decode().catch(function(){}) : new Promise(function(ok){ im.onload=ok; setTimeout(ok,600); }); }
  /* la scena si sceglie solo quando lo schermo ha le misure definitive (verticale o orizzontale) */
  function prepare(){
    setScene(orient());
    Promise.all([ready(i1), ready(img)]).then(function(){ requestAnimationFrame(function(){ requestAnimationFrame(go); }); });
  }
  setTimeout(function(){ requestAnimationFrame(prepare); }, 80);
  function go(){
    if(orient()!==K && tries++<3){ prepare(); return; }   // l'orientamento è cambiato: ricarica la scena giusta
    var T=layout(), X=T.x, Y=T.y, R=T.R;
    if(!(R>4)){ finish(); return; }
    started=true;
    ball.style.width=ball.style.height=(2*R)+"px";
    ring.style.cssText="left:"+(X-R)+"px;top:"+(Y-R)+"px;width:"+(2*R)+"px;height:"+(2*R)+"px";
    flash.style.cssText="left:"+(X-2*R)+"px;top:"+(Y-2*R)+"px;width:"+(4*R)+"px;height:"+(4*R)+"px";
    var end=[X-R, Y-R];
    if(!ball.animate || matchMedia("(prefers-reduced-motion: reduce)").matches){
      ball.style.transform="translate("+end[0]+"px,"+end[1]+"px)"; i2.style.opacity=1; title.style.opacity=1; lts.forEach(function(l){ l.style.opacity=1; }); setTimeout(finish,1300); return; }
    var start=[-R*1.4, V.h+R*.3, 1.9], mid=[V.w*(K==="l" ? .42 : .30)-R, V.h*(K==="l" ? .30 : .40)-R, 1.3];
    var T0=350, FLY=1150, HIT=T0+FLY, ease="cubic-bezier(.3,.15,.35,1)";
    function tr(x,y,s,rot){ return "translate("+x+"px,"+y+"px) scale("+s+")"+(rot!=null ? " rotate("+rot+"deg)" : ""); }
    /* traiettoria: in verticale come prima; in orizzontale una curva a giro (Bézier) che sfrutta tutta la larghezza */
    function P(t){
      if(K!=="l"){ var a=start, b=mid, c=[end[0],end[1],1], u=t<.5 ? t/.5 : (t-.5)/.5, A=t<.5 ? a : b, B=t<.5 ? b : c;
        return [A[0]+(B[0]-A[0])*u, A[1]+(B[1]-A[1])*u, A[2]+(B[2]-A[2])*u]; }
      var p0=[-R*1.6, V.h+R*.2-R], p1=[V.w*.42-R, V.h*.98-R], p2=[V.w*.80-R, V.h*.62-R], p3=[end[0],end[1]], m=1-t;
      var x=m*m*m*p0[0]+3*m*m*t*p1[0]+3*m*t*t*p2[0]+t*t*t*p3[0], y=m*m*m*p0[1]+3*m*m*t*p1[1]+3*m*t*t*p2[1]+t*t*t*p3[1];
      return [x, y, 1.6+(1-1.6)*Math.pow(t,.9)];
    }
    var frames=[];
    for(var k=0;k<=40;k++){ var q=P(k/40); frames.push({transform:tr(q[0],q[1],q[2]), offset:k/40}); }
    ball.animate(frames,{duration:FLY,delay:T0,easing:ease,fill:"both"});
    img.animate([{transform:"rotate(0deg)"},{transform:"rotate(-900deg)"}],{duration:FLY,delay:T0,easing:ease,fill:"both"});
    /* le lettere seguono la stessa traiettoria del tiro e poi si posano al loro posto */
    title.style.opacity=1;
    lts.forEach(function(l,i){
      var r=l.getBoundingClientRect(), fx=r.left+r.width/2, fy=r.top+r.height/2;
      var kf=[], spread=(i-4)*R*.16;
      [0,.15,.3,.45].forEach(function(t,j){
        var q=P(t), x=q[0]+R+spread*(t/.45), y=q[1]+R;
        kf.push({transform:"translate("+(x-fx)+"px,"+(y-fy)+"px) scale("+(.3+j*.3)+") rotate("+(-160+j*40)+"deg)", opacity:j===0?0:1, offset:j*.18});
      });
      kf.push({transform:"translate(0,0) scale(1) rotate(0deg)", opacity:1, offset:1});
      l.animate(kf,{duration:950,delay:T0+260+i*55,easing:"cubic-bezier(.25,.8,.3,1)",fill:"both"});
    });
    setTimeout(function(){
      i2.animate([{opacity:0},{opacity:1}],{duration:140,fill:"forwards"});
      ball.animate([{transform:tr(end[0],end[1],1)},{transform:tr(end[0],end[1],.86)},{transform:tr(end[0],end[1],.92)}],{duration:420,easing:"ease-out",fill:"forwards"});
      ring.animate([{transform:"scale(.6)",opacity:.9},{transform:"scale(2.4)",opacity:0}],{duration:700,easing:"ease-out",fill:"forwards"});
      flash.animate([{opacity:0},{opacity:.85,offset:.2},{opacity:0}],{duration:600,fill:"forwards"});
      stage.animate([{translate:"0 0"},{translate:"5px -4px"},{translate:"-4px 3px"},{translate:"2px -1px"},{translate:"0 0"}],{duration:300});
      if(navigator.vibrate) try{ navigator.vibrate(30); }catch(e){}
    }, HIT);
    var lastL=T0+260+(lts.length-1)*55+900;
    setTimeout(function(){
      sp.querySelector(".sname").animate([{filter:"brightness(1)"},{filter:"brightness(1.8)"},{filter:"brightness(1)"}],{duration:500});
      sub.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],{duration:450,fill:"forwards"});
    }, lastL);
    setTimeout(finish, Math.max(HIT, lastL)+1050);
  }
})();

    let cached = null; try { cached = JSON.parse(localStorage.getItem("fav:" + f.key)); } catch {}

}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const mem = new Map();
async function getJSON(url, ttlSec, noStore){
  url = url.replace(/^http:/, "https:");
  const now = Date.now();
  const hit = mem.get(url) || store.get("c:" + url);
  if (hit && now - hit.t < ttlSec * 1000) return { data: hit.d, at: hit.t };
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 10000);
    const r = await fetch(url, { signal: ctl.signal }); clearTimeout(tm);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const rec = { t: now, d }; mem.set(url, rec);
    if (!noStore && JSON.stringify(d).length < 400000) store.set("c:" + url, rec);
    return { data: d, at: now };
  } catch (e) {
    if (hit) return { data: hit.d, at: hit.t, stale: true };
    throw e;
  }
}
const fmt = (d, o) => d.toLocaleString("it-IT", Object.assign({ timeZone: TZ }, o));
const timeOf = d => fmt(d, { hour:"2-digit", minute:"2-digit" });
const dayKey = d => fmt(d, { year:"numeric", month:"2-digit", day:"2-digit" }).split("/").reverse().join("");
const keyDate = k => new Date(k.replace(/(\d{4})(\d{2})(\d{2})/, "$1-$2-$3"));
function dayFromOffset(off){ const d = new Date(); d.setDate(d.getDate() + off); return d; }
function dayLabel(off){
  const d = dayFromOffset(off), n = fmt(d, { day:"numeric" });
  if (off === 0) return ["Oggi", n]; if (off === -1) return ["Ieri", n]; if (off === 1) return ["Domani", n];
  return [fmt(d, { weekday:"short" }).replace(".", ""), n];
}

function norm(e, slug){
  const c = (e.competitions && e.competitions[0]) || {};
  const cs = c.competitors || [];
  const side = h => {
    const x = cs.find(k => k.homeAway === h) || {}, t = x.team || {}, logos = t.logos || [];
    const sc = x.score == null ? null : (typeof x.score === "object" ? (x.score.displayValue ?? x.score.value) : x.score);
    const so = x.shootoutScore ?? (typeof x.score === "object" ? x.score.shootoutScore : null);
    return { id:String(t.id || ""), name:t.shortDisplayName || t.displayName || "?", full:t.displayName || t.shortDisplayName || "?",
             logo:t.logo || (logos[0] && logos[0].href) || "", score:sc, so: so == null ? null : so, color:t.color, form:x.form || "" };
  };
  const status = c.status || e.status || {}, st = status.type || {}, detail = st.shortDetail || st.detail || "";
  return { id:e.id, date:new Date(e.date), slug, home:side("home"), away:side("away"),
           state:/postpon|cancel|suspend/i.test(detail + (st.name || "")) ? "ppd" : (st.state || "pre"),
           stName:st.name || "", clock:status.displayClock, detail, venue:c.venue && (c.venue.fullName || c.venue.displayName),
           note:(c.notes && c.notes[0] && c.notes[0].headline) || "" };
}
/* Fase della partita: etichetta, supplementari, rigori */
function phase(m){
  const n = (m.stName || "") + " " + (m.detail || "");
  const rig = /SHOOTOUT|PEN/i.test(n), sup = rig || /EXTRA|AET|\bET\b|OVERTIME/i.test(n);
  let label = "";
  if (m.state === "in"){
    if (/SHOOTOUT/i.test(n)) label = "Rigori in corso";
    else if (/HALF/i.test(n) && !/FIRST|SECOND/i.test(m.stName)) label = "Intervallo";
    else if (/END_OF_REGULATION|END_REG/i.test(n)) label = "Fine 90'";
    else if (/END_OF_EXTRA/i.test(n)) label = "Fine suppl.";
    else label = m.clock && m.clock !== "0'" ? m.clock : "In corso";
  } else if (m.state === "post") label = rig ? "Dopo i rigori" : sup ? "Dopo i suppl." : "Finale";
  else if (m.state === "ppd") label = "Rinviata";
  const soTxt = m.home.so != null && m.away.so != null ? `Rigori ${m.home.so}–${m.away.so}` : "";
  return { label, sup: sup && !rig, rig, soTxt };
}
const statusIt = m => phase(m).label;
function extraBadge(m){
  const p = phase(m);
  if (p.rig) return `<span class="xb rig">${esc(p.soTxt || "Rigori")}</span>`;
  if (p.sup) return `<span class="xb sup">Supplementari</span>`;
  return "";
}

let immTimer = null, peekTimer = null;

  clearTimeout(immTimer);
  const phoneLand = window.innerWidth > window.innerHeight && window.innerHeight <= 540;
  if (!phoneLand){ document.body.classList.remove("land", "immersive", "peek"); return; }
  document.body.classList.add("land");

  clearTimeout(peekTimer);

}

async function ensureLogos(){
  const saved = store.get("logos") || {}, tries = store.get("logoTry") || {};
  if (store.get("logosV") === 3 && Date.now() - (store.get("logosT") || 0) < 7 * 864e5) return;

async function viewOggi(){
  const L = S.league === "all" ? null : BY[S.league];
  const days = [-2,-1,0,1,2,3,4,5,6];
  $("#view").innerHTML = header(L ? esc(L.n) : "Partite", L) +
    `<div class="days">${days.map(o => { const [a,b] = dayLabel(o); return `<button class="day press" data-d="${o}" aria-current="${S.day === o}"><span>${a}</span><b>${b}</b></button>`; }).join("")}</div>

  $("#view").querySelector(".days").addEventListener("click", e => { const b = e.target.closest(".day"); if (!b) return; S.day = +b.dataset.d; save(); viewOggi(); });
  const cur = $("#view").querySelector('.day[aria-current="true"]'); if (cur) cur.scrollIntoView({ inline:"center", block:"nearest" });

  const key = dayKey(dayFromOffset(S.day)), list = L ? [L] : LEAGUES;
  const ttl = S.day === 0 ? 25 : (S.day < 0 ? 3600 : 900);
  let at = Date.now(), stale = false, failed = 0;
  const groups = await Promise.all(list.map(async l => {
    try {
      if (l.s === "ita.3"){ const u = await u23Matches(); return { l, ms:u.ms.filter(m => dayKey(m.date) === key) }; }
      const r = await getJSON(`${API}/site/v2/sports/soccer/${l.s}/scoreboard?dates=${key}`, ttl);
      at = Math.min(at, r.at); stale = stale || r.stale;
      return { l, ms:(r.data.events || []).map(e => norm(e, l.s)).filter(m => dayKey(m.date) === key).sort((a,b) => a.date - b.date) };
    } catch { failed++; return { l, ms:[] }; }
  }));
  if (S.tab !== "oggi") return;
  stamp(at, stale);
  const shown = groups.filter(g => g.ms.length);
  let html;
  if (failed === list.length) html = `<div class="sheet">${emptyBox("Dati non raggiungibili", "Controlla la connessione: sul Wi‑Fi di casa prova con la rete dati.", true)}</div>`;
  else if (!shown.length) html = `<div class="sheet">${emptyBox("Nessuna partita", (L ? esc(L.n) + " non ha" : "Nessuna competizione ha") + " partite in questo giorno.")}</div>`;
  else html = `<div class="sheet">${favSection(shown)}${shown.map(g => `<section>${band(g.l, `<span class="count">${g.ms.length} ${g.ms.length === 1 ? "partita" : "partite"}</span>`)}
      <div class="rows">${g.ms.map(m => matchRow(m, g.l)).join("")}</div></section>`).join("")}</div>`;
  if (failed && failed < list.length) html += `<p class="note">${failed} competizioni non hanno risposto: riprova tra poco.</p>`;
  $("#list").innerHTML = html;
  clearTimeout(refreshTimer);
  if (shown.some(g => g.ms.some(m => m.state === "in"))) refreshTimer = setTimeout(() => S.tab === "oggi" && !openEv && viewOggi(), 30000);
}
/* "Le tue squadre": le partite delle preferite in cima, prima di tutto il resto */
function favSection(groups){
  const ms = [];
  const fav = t => t.id === "u23" || isFavId(t.id) || FAVS.some(f => !f.id && (f.re.test(t.full) || f.re.test(t.name)));
  for (const g of groups) for (const m of g.ms) if (fav(m.home) || fav(m.away)) ms.push({ m, l:g.l });
  if (!ms.length) return "";
  ms.sort((a,b) => a.m.date - b.m.date);
  return `<section><div class="band" style="--lc:#f0a92a"><span class="spot favspot">${ICONS.star}</span><h2>Le tue squadre</h2><span class="count">${ms.length} ${ms.length === 1 ? "partita" : "partite"}</span></div>
    <div class="rows">${ms.map(x => matchRow(x.m, x.l, true)).join("")}</div></section>`;
}
function matchRow(m, l, showComp){
  const ita = t => l.euro && ITA_RE.test(t.full) ? " ita" : "";
  const res = (t, o) => m.state === "post" && t.score != null && o.score != null && +t.score < +o.score ? " lose" : "";
  let mid;
  if (m.state === "pre") mid = `<span class="pill pre">${m.tbd ? "—" : timeOf(m.date)}</span>`;
  else if (m.state === "ppd") mid = `<span class="pill pre">—</span><span class="st">Rinviata</span>`;

  if (showComp) mid += `<span class="cmp">${leagueLogo(l.s) ? `<img src="${esc(leagueLogo(l.s))}" alt="">` : ""}${esc(l.n)}</span>`;
  return `<div class="m" role="button" tabindex="0" data-ev="${esc(m.id)}" data-sl="${esc(m.slug)}">
    <div class="t h${ita(m.home)}${res(m.home, m.away)}"><span>${esc(m.home.name)}</span><span class="spot">${crest(m.home.logo, m.home.name)}</span></div>
    <div class="mid">${mid}</div>
    <div class="t${ita(m.away)}${res(m.away, m.home)}"><span class="spot">${crest(m.away.logo, m.away.name)}</span><span>${esc(m.away.name)}</span></div></div>`;
}

/* ---------- INTER U23 (Serie C) ----------
   ESPN non pubblica la Serie C: calendario e risultati ufficiali vengono da inter.it
   e stanno nel file u23.json accanto all'app, aggiornato ogni sera alle 19:30. */
const U23 = { key:"u23", name:"Inter U23", id:"u23", logo:"https://a.espncdn.com/i/teamlogos/soccer/500/110.png" };
const U23_URL = "https://stich130476.github.io/calcio-hub/u23.json";
async function u23Logos(names){
  const saved = store.get("u23logos") || {};
  if (Date.now() - (saved._t || 0) < 30 * 864e5 && names.every(n => n in saved)) return saved;
  const out = { _t: Date.now() };
  const plain = x => (x || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
  await Promise.all(names.map(async n => {
    try {
      const r = await espnSearch(n);
      const hit = r.teams.find(t => plain(t.name) === plain(n));   // solo nome identico: mai uno stemma sbagliato
      out[n] = hit ? hit.logo : "";
    } catch { out[n] = saved[n] || ""; }
  }));
  store.set("u23logos", out);
  return out;
}
async function u23Matches(){
  const { data, at, stale } = await getJSON(U23_URL, 600);
  const ps = data.partite || [];
  const names = [...new Set(ps.flatMap(p => [p.casa, p.ospite]).filter(n => n !== U23.name))];
  const official = data.stemmi || {};
  let logos = Object.assign({}, store.get("u23logos") || {}, official);
  if (!names.every(n => n in logos)) u23Logos(names).then(() => { if (S.tab === "mie" && S.fav === "u23") viewMie(); });
  const side = (n, sc) => n === U23.name
    ? { id:"u23", name:n, full:n, logo:U23.logo, score:sc ?? null, so:null }
    : { id:"u23:" + n, name:n, full:n, logo:logos[n] || "", score:sc ?? null, so:null };
  const ms = ps.map(p => {
    const done = p.gc != null && p.go != null;
    return { id:"u23-" + p.g, g:p.g, date:new Date(p.d), slug:"ita.3", home:side(p.casa, p.gc), away:side(p.ospite, p.go),
             state: done ? "post" : "pre", stName: done ? "STATUS_FULL_TIME" : "", detail:"", tbd: !p.ora, venue:"", note:"" };
  }).sort((a,b) => a.date - b.date);
  return { ms, at, stale, upd: data.aggiornato };
}
async function viewU23(){
  let r;
  try { r = await u23Matches(); }
  catch { $("#favbody").innerHTML = `<div class="sheet">${emptyBox("Calendario non raggiungibile", "Controlla la connessione e riprova.", true)}</div>`; stamp(); return; }
  if (S.tab !== "mie" || S.fav !== "u23") return;
  stamp(r.at, r.stale);
  const now = Date.now();
  const last = r.ms.filter(m => m.state === "post").slice(-1)[0];

  html += `<div class="seclbl">Prossime partite</div>` + (next.length ? `<div class="cards">${next.map(m => card(m, U23)).join("")}</div>`

  html += `<div class="seclbl">Tutta la stagione · Serie C girone C</div><div class="sheet">${r.ms.map(m =>
      `<div class="u23d">Giornata ${m.g}<span>${esc(fmt(m.date, { weekday:"short", day:"numeric", month:"short" }).replace(/\./g, ""))}${m.tbd ? " · orario da definire" : ""}</span></div>${matchRow(m, BY["ita.3"])}`).join("")}</div>
    <p class="note" style="text-align:center;margin-top:12px">Calendario e risultati ufficiali di inter.it, aggiornati ogni sera.<br>Per la Serie C non esiste una fonte gratuita con la diretta.</p>`;
  $("#favbody").innerHTML = html;

/* ---------- LE MIE ---------- */
async function resolveFav(f){
  const cache = store.get("fav:" + f.key);
  if (cache && Date.now() - cache.t < 7 * 864e5) return Object.assign(f, cache.v);
  for (const s of f.look){
    try {
      const { data } = await getJSON(`${API}/site/v2/sports/soccer/${s}/teams`, 7 * 86400);
      const teams = ((((data.sports || [])[0] || {}).leagues || [])[0] || {}).teams || [];
      const hit = teams.map(t => t.team).find(t => (f.id && String(t.id) === f.id) || f.re.test(t.displayName) || f.re.test(t.shortDisplayName || ""));
      if (hit){
        const v = { id:String(hit.id), home:s, logo:(hit.logos && hit.logos[0] && hit.logos[0].href) || "" };
        store.set("fav:" + f.key, { t:Date.now(), v }); return Object.assign(f, v);
      }
    } catch {}
  }
  if (f.id && !f.home) f.home = f.look[0];
  return f;
}
/* Calendario della lega: le date in cui si gioca (aggiornato ogni giorno) */
async function leagueDays(s){
  const { data } = await getJSON(`${API}/site/v2/sports/soccer/${s}/scoreboard`, 86400);
  const cal = (((data.leagues || [])[0] || {}).calendar || []).map(x => String(x.value || x.startDate || x).slice(0, 10).replace(/-/g, ""));
  return [...new Set(cal)].filter(k => /^\d{8}$/.test(k)).sort();
}
/* Cerca le partite di una squadra nei risultati giorno per giorno della lega */
async function scanLeague(s, f){
  const days = await leagueDays(s), today = dayKey(new Date());
  const past = days.filter(k => k < today).slice(-3), fut = days.filter(k => k >= today);
  const found = []; let id = f.id || null;
  const isMe = t => (id && t.id === id) || f.re.test(t.full) || f.re.test(t.name);
  const check = async keys => {
    const res = await Promise.all(keys.map(k => getJSON(`${API}/site/v2/sports/soccer/${s}/scoreboard?dates=${k}`, k < today ? 86400 : k === today ? 25 : 900)
      .then(r => r.data.events || []).catch(() => [])));
    for (const evs of res) for (const e of evs){
      const m = norm(e, s);
      if (isMe(m.home) || isMe(m.away)){
        if (!id) id = isMe(m.home) ? m.home.id : m.away.id;
        if (!f.logo) f.logo = isMe(m.home) ? m.home.logo : m.away.logo;
        found.push(m);
      }
    }
  };
  await check(past);
  for (let i = 0; i < fut.length && i < 30 && found.filter(m => m.state !== "post").length < 5; i += 6) await check(fut.slice(i, i + 6));
  return { found, id };
}
async function teamMatches(f){
  const seen = new Map(); let at = Date.now(), stale = false;
  const add = list => { for (const m of list) if (!seen.has(m.id)) seen.set(m.id, m); };
  // 1) campionato: dalla lega in cui gioca ora (se cambia per promozione o retrocessione, la ritrova da sola)
  const cand = f.home ? [f.home, ...f.look.filter(s => s !== f.home)] : f.look;
  for (const s of cand){
    try {
      const r = await scanLeague(s, f);
      if (r.found.length){
        add(r.found);
        if (r.id && (r.id !== f.id || s !== f.home)){
          f.id = r.id; f.home = s;
          store.set("fav:" + f.key, { t:Date.now(), v:{ id:f.id, home:s, logo:f.logo || "" } });
          if (FAVS.includes(f)) saveFavs();
        }
        break;
      }
    } catch {}
  }
  if (!f.id) return { next:[], last:null, at, stale };
  // 2) coppe nazionali ed europee (e il calendario squadra, quando è completo)
  const slugs = [f.home, ...(CUPS[f.home] || []), ...UEFA_CUPS].filter(Boolean);
  await Promise.all(slugs.flatMap(s => [true, false].map(async fixture => {
    try {
      const r = await getJSON(`${API}/site/v2/sports/soccer/${s}/teams/${f.id}/schedule${fixture ? "?fixture=true" : ""}`, 1800);
      at = Math.min(at, r.at); stale = stale || r.stale;
      if (!f.logo && r.data.team) f.logo = (r.data.team.logos && r.data.team.logos[0] && r.data.team.logos[0].href) || r.data.team.logo || "";
      for (const e of (r.data.events || [])) if (!seen.has(e.id)) seen.set(e.id, norm(e, s));
    } catch {}
  })));
  const all = [...seen.values()].sort((a,b) => a.date - b.date), now = Date.now();
  return { next: all.filter(m => m.state === "in" || (m.state !== "post" && m.date.getTime() > now - 3 * 3600e3)).slice(0, 5),
           last: all.filter(m => m.state === "post").slice(-1)[0], at, stale };
}
async function viewMie(){
  if (!FAVS.length){
    $("#view").innerHTML = header("Le mie squadre") + `<div class="sheet">${emptyBox("Nessuna squadra preferita", "Aggiungi le squadre che vuoi seguire: vedrai prossime partite, risultati e calendario.")}
      <div style="text-align:center;padding-bottom:22px"><button class="press addbtn" data-edit>Aggiungi squadre</button></div></div>`;

  }

       <button class="chip press" data-f="u23" aria-current="${S.fav === "u23"}">${crest(U23.logo, U23.name)}${esc(U23.name)}</button>
       <button class="chip press edit" data-edit aria-label="Modifica squadre preferite"><span class="ico">${ICONS.edit}</span>Modifica</button></div>
     <div id="favbody"><div class="cards"><div class="card"><div class="skel"></div></div><div class="card"><div class="skel"></div></div></div></div>`;
  $("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b || b.hasAttribute("data-edit")) return; S.fav = b.dataset.f; save(); viewMie(); });
  Promise.all(FAVS.map(resolveFav)).then(() => {

  });
  if (S.fav === "u23") return viewU23();
  const f = await resolveFav(FAVS.find(x => x.key === S.fav) || FAVS[0]);
  if (S.tab !== "mie") return;
  const r = await teamMatches(f);
  if (S.tab !== "mie" || S.fav !== f.key) return;
  stamp(r.at, r.stale);
  if (!f.id){ $("#favbody").innerHTML = `<div class="sheet">${emptyBox("Squadra non trovata", esc(f.name) + " non compare nelle partite dei campionati controllati.", true)}</div>`; return; }
  const chip = $("#chips").querySelector(`[data-f="${f.key}"] .crest`); if (f.logo && chip && chip.tagName !== "IMG") chip.outerHTML = crest(f.logo, f.name);
  let html = "";
  if (r.last) html += `<div class="seclbl">Ultima partita</div><div class="cards">${card(r.last, f)}</div>`;

function card(m, f){

async function fullSeason(f, onProgress){
  if (!f.id || !f.home) await teamMatches(f);
  if (!f.id || !f.home) return null;
  const days = await leagueDays(f.home), today = dayKey(new Date()), seen = new Map();
  for (let i = 0; i < days.length; i += 8){
    const batch = days.slice(i, i + 8);
    const res = await Promise.all(batch.map(k => getJSON(`${API}/site/v2/sports/soccer/${f.home}/scoreboard?dates=${k}`, k < today ? 86400 : k === today ? 25 : 900)
      .then(r => r.data.events || []).catch(() => [])));
    for (const evs of res) for (const e of evs){ const m = norm(e, f.home); if (m.home.id === f.id || m.away.id === f.id) seen.set(m.id, m); }
    if (onProgress) onProgress(Math.min(i + 8, days.length), days.length);
  }
  const slugs = [...(CUPS[f.home] || []), ...UEFA_CUPS, f.home].filter(Boolean);
  await Promise.all(slugs.flatMap(s => [true, false].map(fx =>
    getJSON(`${API}/site/v2/sports/soccer/${s}/teams/${f.id}/schedule${fx ? "?fixture=true" : ""}`, 1800)
      .then(r => (r.data.events || []).forEach(e => { if (!seen.has(e.id)) seen.set(e.id, norm(e, s)); })).catch(() => {}))));
  return [...seen.values()].sort((a,b) => a.date - b.date);
}
function outcome(m, id){
  if (m.state !== "post") return null;
  const me = m.home.id === id ? m.home : m.away, op = m.home.id === id ? m.away : m.home;
  let a = +me.score, b = +op.score;
  if (a === b && me.so != null && op.so != null){ a = +me.so; b = +op.so; }
  return a > b ? "w" : a < b ? "l" : "d";
}
function teamHead(f){
  const fav = FAVS.some(x => x.id && x.id === f.id);
  return `<div class="th"><span class="spot">${crest(f.logo, f.name)}</span>
    <div class="tt"><h1>${esc(f.full || f.name)}</h1><div class="sub">${f.home && BY[f.home] ? esc(BY[f.home].n) : "Squadra"}</div></div>
    <button class="iconbtn favtog${fav ? " on" : ""}" data-favtog aria-label="${fav ? "Togli dai preferiti" : "Aggiungi ai preferiti"}">${fav ? ICONS.star : ICONS.starO}</button></div>`;
}
const seasonMemo = new Map();
function seasonOf(f, onProgress){
  const k = f.id + "|" + (f.home || "");
  const hit = seasonMemo.get(k);
  if (hit && Date.now() - hit.t < 10 * 60e3) return hit.p;
  const p = fullSeason(f, onProgress);
  seasonMemo.set(k, { t:Date.now(), p });
  p.then(v => { if (!v) seasonMemo.delete(k); }).catch(() => seasonMemo.delete(k));
  return p;
}

const nz = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
let teamsIdx = null, playersIdx = null, lastFound = new Map();
/* Elenco squadre: dalle classifiche (sempre affidabili) e dagli elenchi delle leghe */
async function teamsIndex(){
  if (teamsIdx) return teamsIdx;
  const out = new Map();
  const put = (t, slug) => { if (!t || !t.id) return; const id = String(t.id);
    if (out.has(id) && !(BY[out.get(id).slug] || {}).euro) return;   // preferisce il campionato nazionale
    out.set(id, { id, name:t.shortDisplayName || t.displayName, full:t.displayName || t.shortDisplayName, logo:(t.logos && t.logos[0] && t.logos[0].href) || t.logo || "", slug }); };
  await Promise.all(LEAGUES.filter(l => !l.cup).map(async l => {
    try {
      const { data } = await getJSON(`${API}/v2/sports/soccer/${l.s}/standings`, 3600);
      const walk = o => { if (!o) return; ((o.standings || {}).entries || []).forEach(e => put(e.team, l.s)); (o.children || []).forEach(walk); };
      walk(data);
    } catch {}
    if (l.euro) return;
    try {
      const { data } = await getJSON(`${API}/site/v2/sports/soccer/${l.s}/teams`, 7 * 86400);
      (((((data.sports || [])[0] || {}).leagues || [])[0] || {}).teams || []).forEach(x => put(x.team, l.s));
    } catch {}
  }));
  FAVS.forEach(f => { if (f.id && !out.has(f.id)) out.set(f.id, { id:f.id, name:f.name, full:f.full || f.name, logo:f.logo, slug:f.home }); });
  const list = [...out.values()];
  if (list.length > 20) teamsIdx = list;   // un elenco vuoto o parziale non viene memorizzato
  return list;
}
/* Elenco giocatori: dalle rose delle squadre dei campionati principali (costruito una volta a settimana) */
const ROSTER_LEAGUES = ["ita.1","eng.1","esp.1","ger.1","fra.1","ita.2","sco.1","ned.1","bel.1"];
let pidxBuilding = null, pidxProg = null;
function playersIndex(onProg){
  if (playersIdx) return Promise.resolve(playersIdx);
  const c = store.get("pidx");
  if (c && Date.now() - c.t < 7 * 864e5 && c.v && c.v.length > 300) return Promise.resolve(playersIdx = c.v);
  if (onProg) pidxProg = onProg;
  if (pidxBuilding) return pidxBuilding;
  pidxBuilding = (async () => {
    const teams = (await teamsIndex()).filter(t => ROSTER_LEAGUES.includes(t.slug));
    const out = []; let done = 0;
    for (let i = 0; i < teams.length; i += 10){
      await Promise.all(teams.slice(i, i + 10).map(async t => {
        try {
          const { data } = await getJSON(`${API}/site/v2/sports/soccer/${t.slug}/teams/${t.id}/roster`, 7 * 86400, true);
          (data.athletes || []).forEach(a => { const x = athOf(a, Object.assign({ home:t.slug }, t));
            out.push({ i:x.id, n:x.name, j:x.jersey, p:x.pos, pn:x.posName, a:x.age, c:x.nat, f:x.natCode, h:x.height, w:x.weight, t:t.id, tn:t.full || t.name, tl:t.logo, s:t.slug }); });
        } catch {}
        done++;
      }));
      if (pidxProg) pidxProg(done, teams.length);
    }
    if (out.length > 300){ store.set("pidx", { t:Date.now(), v:out }); playersIdx = out; }
    pidxBuilding = null;
    return out;
  })();
  return pidxBuilding;
}
const fromIdx = x => ({ id:x.i, name:x.n, jersey:x.j, pos:x.p, posName:x.pn, age:x.a, nat:x.c, natCode:x.f,
  flag:x.f ? `https://a.espncdn.com/i/teamlogos/countries/500/${x.f}.png` : "", height:x.h, weight:x.w, teamId:x.t, team:x.tn, teamLogo:x.tl, slug:x.s });
/* Ricerca ufficiale ESPN: squadre e giocatori di tutto il mondo */
async function espnSearch(q){
  const out = { teams:[], players:[] };
  try {
    const { data } = await getJSON(`https://site.web.api.espn.com/apis/search/v2?query=${encodeURIComponent(q)}&limit=20&lang=it`, 3600);
    for (const g of (data.results || [])) for (const c of (g.contents || [])){
      const sport = c.sport || (c.sportName || "");
      if (sport && !/soccer/i.test(sport)) continue;
      const uid = c.uid || "", kind = (g.type || c.type || "").toLowerCase();
      if (kind === "team"){
        const id = (/~t:(\d+)/.exec(uid) || [])[1]; if (!id) continue;
        const img = c.image || {};
        out.teams.push({ id, name:c.displayName, full:c.displayName, slug:c.defaultLeagueSlug || "", sub:c.subtitle || "",
          logo:img.default || (c.images && c.images[0] && c.images[0].url) || `https://a.espncdn.com/i/teamlogos/soccer/500/${id}.png` });
      } else if (kind === "player"){
        const id = (/~a:(\d+)/.exec(uid) || [])[1]; if (!id) continue;
        out.players.push({ id, name:c.displayName, team:c.subtitle || "", slug:c.defaultLeagueSlug || "", sub:c.description || "",
          head:`https://a.espncdn.com/i/headshots/soccer/players/full/${id}.png` });
      }
    }
  } catch {}
  return out;
}

let searchSeq = 0;
async function runSearch(q, box, mode){
  const s = nz(q.trim()), seq = ++searchSeq;
  if (s.length < 2){ box.innerHTML = `<p class="note" style="text-align:center;padding:18px">Scrivi almeno 2 lettere: per esempio Dortmund, Palermo, Bastoni.</p>`; return; }
  box.innerHTML = `<div class="sheet"><div class="skel"></div><div class="skel"></div></div>`;
  const words = s.split(/\s+/);
  const hit = txt => { const n = nz(txt); return words.every(w => n.includes(w)); };
  const ready = !!playersIdx || !!(store.get("pidx") || {}).v;
  const [local, remote, pls] = await Promise.all([teamsIndex(), espnSearch(q.trim()), mode !== "add" && ready ? playersIndex() : Promise.resolve([])]);
  if (seq !== searchSeq) return;
  const teams = new Map();
  local.filter(t => hit(t.full) || hit(t.name)).forEach(t => teams.set(t.id, t));
  remote.teams.forEach(t => { if (!teams.has(t.id)) teams.set(t.id, t); else if (!teams.get(t.id).slug) teams.get(t.id).slug = t.slug; });

    const players = new Map();

    remote.players.forEach(r => { if (!players.has(r.id)) players.set(r.id, { id:r.id, name:r.name, team:r.team, slug:r.slug }); });
    const pl = [...players.values()].sort((a,b) => (nz(a.name).split(" ").some(w => w.startsWith(words[0])) ? 0 : 1) - (nz(b.name).split(" ").some(w => w.startsWith(words[0])) ? 0 : 1)).slice(0, 15);

      .then(() => { if (seq === searchSeq && box.isConnected) runSearch(q, box, mode); });

  let t = idx.find(x => nz(x.full) === k || nz(x.name) === k || nz(x.full) === it || nz(x.name) === it);
  if (t) return t.logo;
  if (k.length >= 5){
    const c = idx.filter(x => nz(x.full).includes(k) || k.includes(nz(x.full)) || (nz(x.name).length >= 5 && (k.includes(nz(x.name)) || nz(x.name).includes(k))));
    if (c.length === 1) return c[0].logo;
  }
  return "";
}
const isFavName = n => FAVS.some(f => f.re.test(n) || f.re.test(albName(n)) || nz(f.name) === nz(albName(n)));
function alboBadge(name, logo, color){
  if (logo) return crest(logo, name);
  return `<span class="crest ph abadge" style="--lc:${color}">${initials(albName(name))}</span>`;
}

/* ---------- STORIA: record automatici, record storici, accadde oggi, lo sapevi ---------- */
const endYear = y => { const m = /^(\d{4})(?:[–-](\d{2,4}))?/.exec(y || ""); return m ? +m[1] + (m[2] ? 1 : 0) : 0; };
const CLUB_ALIAS = { "inter milan":"internazionale", "inter":"internazionale", "fc internazionale milano":"internazionale", "ac milan":"milan",
  "fc bayern munchen":"bayern munich", "bayern munchen":"bayern munich", "fc barcelona":"barcelona", "paris sg":"paris saint-germain", "psg":"paris saint-germain",
  "atletico de madrid":"atletico madrid", "athletic club":"athletic bilbao", "olympique de marseille":"marseille", "olympique lyonnais":"lyon", "psv":"psv eindhoven" };
const clubKey = s => { let k = nz(s).replace(/[.'’]/g, "").replace(/\b(fc|ac|as|ss|ssc|cf|afc|sc|us|acf|ssd|rsc|kv|krc|sk|sv|vfb|vfl|tsg|bv)\b/g, "").replace(/\s+/g, " ").trim(); return CLUB_ALIAS[k] || CLUB_ALIAS[nz(s)] || k; };
function sameClub(a, b){ const x = clubKey(a), y = clubKey(b); return !!x && !!y && (x === y || (x.length > 5 && y.length > 5 && (x.startsWith(y + " ") || y.startsWith(x + " ")))); }

/* edizioni di una competizione in ordine e vincitori per edizione */
function editions(slug){
  const A = ALBO[slug]; if (!A) return [];
  const m = new Map();
  A.c.forEach(([n, ys]) => ys.forEach(y => { const k = endYear(y); if (!m.has(k)) m.set(k, { y:k, label:y, w:[] }); m.get(k).w.push(n); }));
  return [...m.values()].sort((a,b) => a.y - b.y);
}
function autoRecords(slug){
  const ed = editions(slug); if (!ed.length) return null;
  const A = ALBO[slug];
  // striscia più lunga di edizioni consecutive vinte
  let best = [], cur = {};
  ed.forEach((e, i) => {
    const next = {};
    e.w.forEach(n => { const r = (cur[n] || []).concat(e); next[n] = r; if (r.length > (best[0] ? best[0].run.length : 0)) best = [{ n, run:r }]; else if (best[0] && r.length === best[0].run.length) best.push({ n, run:r }); });
    cur = next;
  });
  // attese più lunghe tra due titoli (in anni)
  const waits = [];
  A.c.forEach(([n, ys]) => { const s = ys.map(endYear).sort((a,b) => a - b); for (let i = 1; i < s.length; i++) waits.push({ n, a:s[i-1], b:s[i], d:s[i] - s[i-1] }); });
  waits.sort((a,b) => b.d - a.d);
  // prime volte recenti
  const firstSeen = new Set(), firsts = [];
  ed.forEach(e => e.w.forEach(n => { if (!firstSeen.has(n)){ firstSeen.add(n); firsts.push({ n, e }); } }));
  return { ed, streak:best, waits:waits.slice(0, 3), firsts:firsts.slice(-4).reverse(), winners:A.c.length, top:[...A.c].sort((a,b) => b[1].length - a[1].length)[0] };
}
const COUNTRY_PAIRS = [["ita.1","ita.coppa_italia","Italia"],["eng.1","eng.fa","Inghilterra"],["esp.1","esp.copa_del_rey","Spagna"],["ger.1","ger.dfb_pokal","Germania"],
  ["fra.1","fra.coupe_de_france","Francia"],["ned.1","ned.cup","Olanda"],["sco.1","sco.tennents","Scozia"]];
function doublesAndTrebles(){
  const cl = editions("uefa.champions"), clBy = new Map(cl.map(e => [e.y, e.w]));
  const doubles = [], trebles = [];
  COUNTRY_PAIRS.forEach(([lg, cup, country]) => {
    const L = editions(lg), C = new Map(editions(cup).map(e => [e.y, e.w]));
    L.forEach(e => e.w.forEach(n => {
      if ((C.get(e.y) || []).some(m => sameClub(m, n))){
        doubles.push({ n, y:e.y, label:e.label, country });
        if ((clBy.get(e.y) || []).some(m => sameClub(m, n))) trebles.push({ n, y:e.y, label:e.label, country });
      }
    }));
  });
  const byClub = new Map();
  doubles.forEach(d => { const k = d.n + "|" + d.country; if (!byClub.has(k)) byClub.set(k, { n:d.n, country:d.country, ys:[] }); byClub.get(k).ys.push(d.label); });
  return { doubles:[...byClub.values()].sort((a,b) => b.ys.length - a.ys.length || endYear(b.ys[b.ys.length-1]) - endYear(a.ys[a.ys.length-1])), trebles:trebles.sort((a,b) => b.y - a.y) };
}

/* titoli di una squadra in tutti gli albi d'oro */
function clubHonours(team){
  const names = [team.full, team.name].filter(Boolean), out = [];
  Object.keys(ALBO).forEach(slug => {
    const hit = ALBO[slug].c.find(([n]) => names.some(t => sameClub(n, t) || sameClub(albName(n), t)));
    if (hit) out.push({ slug, n:hit[0], ys:hit[1], last:[...hit[1]].sort((a,b) => endYear(a) - endYear(b)).pop() });
  });
  return out.sort((a,b) => b.ys.length - a.ys.length);
}
function didYouKnow(team){
  const h = clubHonours(team); if (!h.length) return "";
  const main = h[0], tot = h.reduce((s, x) => s + x.ys.length, 0);
  const dt = doublesAndTrebles(), dbl = dt.doubles.find(d => h.some(x => x.n === d.n)), tre = dt.trebles.filter(t => h.some(x => x.n === t.n));
  const lines = [];
  lines.push(`<b>${tot}</b> trofei tra quelli dell'archivio, di cui <b>${main.ys.length}</b> ${esc(BY[main.slug] ? BY[main.slug].n : main.slug)} (l'ultimo nel ${esc(main.last)}).`);
  if (tre.length) lines.push(`Ha centrato il <b>triplete</b> campionato, coppa e Champions ${tre.length === 1 ? "nel " + esc(tre[0].label) : tre.length + " volte (" + tre.map(t => esc(t.label)).join(", ") + ")"}.`);
  else if (dbl) lines.push(`Ha vinto campionato e coppa nella stessa stagione <b>${dbl.ys.length}</b> ${dbl.ys.length === 1 ? "volta" : "volte"}, l'ultima nel ${esc(dbl.ys[dbl.ys.length-1])}.`);
  const others = h.slice(1, 4).map(x => `${x.ys.length} ${esc(BY[x.slug] ? BY[x.slug].n : x.slug)}`);
  if (others.length) lines.push(`Nel palmarès anche: ${others.join(" · ")}.`);
  return `<div class="dyk"><span class="dyk-i">${ICONS.albo}</span><div><b class="dyk-t">Lo sapevi?</b>${lines.map(l => `<p>${l}</p>`).join("")}</div></div>`;
}

/* ---------- ACCADDE OGGI ---------- */
const mmdd = d => fmt(d, { month:"2-digit", day:"2-digit" }).split("/").reverse().join("-");
const evFav = e => e[3].some(t => isFavName(t)) || FAVS.some(f => f.re.test(e[2].replace(/^.*?:\s*/, "")) );
function eventsOn(d){ const k = mmdd(d); return STORIA_EVENTI.filter(e => e[0] === k).sort((a,b) => evFav(b) - evFav(a) || b[1] - a[1]); }
function recordOfDay(d){
  const doy = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 0)) / 864e5);
  return STORIA_RECORD[doy % STORIA_RECORD.length];
}

  const e = evs[0];
  const body = e ? `<b>${e[1]}</b> · ${esc(e[2])}` : `<b>Record del giorno</b> · ${esc(r[1])}: ${esc(r[3])}, ${esc(r[2])}.`;
  return `<div class="aoc${e && evFav(e) ? " fav" : ""}" id="aoc" role="button" tabindex="0"><span class="aoc-i">${ICONS.albo}</span>
    <div class="aoc-t"><span>${e ? "Accadde oggi" : "Lo sapevi?"}</span><p>${body}</p></div>
    <button class="aoc-x" data-aox aria-label="Chiudi per oggi">${ICONS.close}</button></div>`;
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-aox]")){ e.stopPropagation(); store.set("aoX", dayKey(new Date())); const c = $("#aoc"); if (c) c.remove(); return; }
  if (e.target.closest("#aoc")){ S.tab = "albo"; S.hist = "ao"; S.aoOff = 0; save(); renderTabs(); render(); animView(); $("#main").scrollTo({ top:0 }); }
});

/* ---------- Avvio ---------- */
function render(){
  clearTimeout(refreshTimer);
  updateImmersive();
  if (S.tab === "mie") return viewMie();
  if (S.tab === "tab") return viewTab();
  if (S.tab === "stat") return viewStat();
  if (S.tab === "albo") return viewStoria();
  return viewOggi();
}
async function doRefresh(){
  if (busy) return; busy = true;
  const b = $("#refresh"); if (b) b.classList.add("spin");
  mem.clear();
  try { for (let i = localStorage.length - 1; i >= 0; i--){ const k = localStorage.key(i); if (k && k.startsWith("c:") && !/\/teams(\?|$)|\/athletes\/|\/seasons\/\d+\/teams\//.test(k)) localStorage.removeItem(k); } } catch {}
  await render(); busy = false;
}
$("#view").addEventListener("click", e => { if (e.target.closest("#refresh") || e.target.closest("[data-retry]")) doRefresh(); });
/* transizione al cambio di sezione o competizione */
function animView(){ const v = $("#view"); v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter"); }
/* trascina giù per aggiornare */
(function(){
  const main = $("#main"), ind = document.createElement("div");
  ind.className = "ptr"; ind.innerHTML = ICONS.refresh; document.body.appendChild(ind);
  let y0 = null, dy = 0;
  main.addEventListener("touchstart", e => { y0 = (main.scrollTop <= 0 && !document.querySelector(".ov")) ? e.touches[0].clientY : null; dy = 0; }, { passive:true });
  main.addEventListener("touchmove", e => {
    if (y0 == null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    ind.style.opacity = Math.min(dy / 90, 1);
    ind.style.transform = `translate(-50%, ${Math.min(dy * .6, 70) - 12}px) rotate(${dy * 3}deg)`;
    ind.classList.toggle("ready", dy > 90);
  }, { passive:true });
  main.addEventListener("touchend", async () => {
    if (y0 == null) return;
    const go = dy > 90; y0 = null;
    if (go){ ind.classList.add("spin"); ind.style.transform = ""; try { await doRefresh(); } catch {} }
    ind.classList.remove("spin", "ready"); ind.style.opacity = 0; ind.style.transform = "";
  });
})();
S.tab = "oggi"; S.league = "all"; S.day = 0; S.aoOff = 0;   // ogni apertura parte dalle partite di oggi
renderRail(); renderTabs(); render(); ensureLogos();
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
</script>
</body>
</html>
