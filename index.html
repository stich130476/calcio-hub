  const cat = cats.includes(S.rcat) ? S.rcat : "Giocatori";
  html += `<div class="seclbl" style="margin:18px 2px 8px">Record storici</div><div class="chips" id="rcat">${cats.map(c => `<button class="chip press" data-rc="${c}" aria-current="${c === cat}" style="padding-left:15px">${c}</button>`).join("")}</div>
    <div class="sheet">${STORIA_RECORD.filter(r => r[0] === cat).sort((a,b) => (b[5] === L.s) - (a[5] === L.s)).map(([c, t, v, who, when, slug]) => `<div class="hr">
      <span class="spot">${compLogo(slug)}</span><div class="who"><span>${esc(t)}</span><b>${esc(who)}</b>${when ? `<small>${esc(when)}</small>` : ""}</div><div class="hv">${esc(v)}</div></div>`).join("")}</div>
    <p class="note" style="text-align:center;margin-top:12px">Record verificati sulle fonti ufficiali. Revisione annuale il 15 luglio.</p>`;
  $("#rec").innerHTML = html;
  $("#rcat").addEventListener("click", e => { const b = e.target.closest("[data-rc]"); if (!b) return; S.rcat = b.dataset.rc; save(); viewRecord(); });
}

/* ---------- ACCADDE OGGI ---------- */
const mmdd = d => fmt(d, { month:"2-digit", day:"2-digit" }).split("/").reverse().join("-");
const evFav = e => e[3].some(t => isFavName(t)) || FAVS.some(f => f.re.test(e[2].replace(/^.*?:\s*/, "")) );
function eventsOn(d){ const k = mmdd(d); return STORIA_EVENTI.filter(e => e[0] === k).sort((a,b) => evFav(b) - evFav(a) || b[1] - a[1]); }
function recordOfDay(d){
  const doy = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 0)) / 864e5);
  return STORIA_RECORD[doy % STORIA_RECORD.length];
}
function viewAccadde(){
  const off = S.aoOff || 0, d = dayFromOffset(off), now = new Date().getFullYear();
  $("#view").innerHTML = storiaHead(null) + `<div class="aonav"><button class="iconbtn" data-ao="-1" aria-label="Giorno precedente">‹</button>
      <div><b>${fmt(d, { day:"numeric", month:"long" })}</b><span>${off === 0 ? "Oggi" : off === 1 ? "Domani" : off === -1 ? "Ieri" : fmt(d, { weekday:"long" })}</span></div>
      <button class="iconbtn" data-ao="1" aria-label="Giorno successivo">›</button></div><div id="ao"></div>` + verFoot();
  bindStoria();
  const s = $("#sub"); if (s) s.textContent = "Il calcio in questo giorno, negli anni passati";
  const evs = eventsOn(d);
  let html = "";
  if (evs.length){
    html = `<div class="sheet">` + evs.map(e => `<div class="aoe${evFav(e) ? " fav" : ""}"><div class="aoy"><b>${e[1]}</b><span>${now - e[1] === 0 ? "quest'anno" : now - e[1] === 1 ? "un anno fa" : (now - e[1]) + " anni fa"}</span></div>
      <span class="spot">${compLogo(e[3][0])}</span><p>${esc(e[2])}</p></div>`).join("") + `</div>`;
  } else {
    const r = recordOfDay(d);
    html = `<div class="sheet">${emptyBox("Nessun evento in archivio per questo giorno", "L'archivio cresce a ogni revisione. Intanto, ecco il record del giorno.")}</div>
      <div class="sheet" style="margin-top:12px"><div class="hr"><span class="spot">${compLogo(r[5])}</span><div class="who"><span>${esc(r[1])}</span><b>${esc(r[3])}</b>${r[4] ? `<small>${esc(r[4])}</small>` : ""}</div><div class="hv">${esc(r[2])}</div></div></div>`;
  }
  $("#ao").innerHTML = html + `<p class="note" style="text-align:center;margin-top:12px">${STORIA_EVENTI.length} eventi in archivio, verificati sulle fonti ufficiali.</p>`;
  $("#view").querySelector(".aonav").addEventListener("click", e => { const b = e.target.closest("[data-ao]"); if (!b) return; S.aoOff = off + +b.dataset.ao; save(); viewAccadde(); });
}
/* scheda piccola in cima a Partite */
function aoCard(){
  const today = dayKey(new Date());
  if (store.get("aoX") === today) return "";
  const evs = eventsOn(new Date()), r = recordOfDay(new Date());
  const e = evs[0];
  const body = e ? `<b>${e[1]}</b> · ${esc(e[2])}` : `<b>Record del giorno</b> · ${esc(r[1])}: ${esc(r[3])}, ${esc(r[2])}.`;
  return `<div class="aoc${e && evFav(e) ? " fav" : ""}" id="aoc" role="button" tabindex="0"><span class="aoc-i">${ICONS.albo}</span>
    <div class="aoc-t"><span>${e ? "Accadde oggi" : "Lo sapevi?"}</span><p>${body}</p></div>
    <button class="aoc-x" data-aox aria-label="Chiudi per oggi">${ICONS.close}</button></div>`;
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-aox]")){ e.stopPropagation(); store.set("aoX", dayKey(new Date())); const c = $("#aoc"); if (c) c.remove(); return; }
  if (e.target.closest("#aoc")){ S.tab = "albo"; S.hist = "ao"; S.aoOff = 0; save(); renderTabs(); render(); animView(); $("#main").scrollTo({ top:0 }); }
});

/* ---------- Avvio ---------- */
function render(){
  clearTimeout(refreshTimer);
  updateImmersive();
  if (S.tab === "mie") return viewMie();
  if (S.tab === "tab") return viewTab();
  if (S.tab === "stat") return viewStat();
  if (S.tab === "albo") return viewStoria();
  return viewOggi();
}
async function doRefresh(){
  if (busy) return; busy = true;
  const b = $("#refresh"); if (b) b.classList.add("spin");
  mem.clear();
  try { for (let i = localStorage.length - 1; i >= 0; i--){ const k = localStorage.key(i); if (k && k.startsWith("c:") && !/\/teams(\?|$)|\/athletes\/|\/seasons\/\d+\/teams\//.test(k)) localStorage.removeItem(k); } } catch {}
  await render(); busy = false;
}
$("#view").addEventListener("click", e => { if (e.target.closest("#refresh") || e.target.closest("[data-retry]")) doRefresh(); });
/* transizione al cambio di sezione o competizione */
function animView(){ const v = $("#view"); v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter"); }
/* trascina giù per aggiornare */
(function(){
  const main = $("#main"), ind = document.createElement("div");
  ind.className = "ptr"; ind.innerHTML = ICONS.refresh; document.body.appendChild(ind);
  let y0 = null, dy = 0;
  main.addEventListener("touchstart", e => { y0 = (main.scrollTop <= 0 && !document.querySelector(".ov")) ? e.touches[0].clientY : null; dy = 0; }, { passive:true });
  main.addEventListener("touchmove", e => {
    if (y0 == null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    ind.style.opacity = Math.min(dy / 90, 1);
    ind.style.transform = `translate(-50%, ${Math.min(dy * .6, 70) - 12}px) rotate(${dy * 3}deg)`;
    ind.classList.toggle("ready", dy > 90);
  }, { passive:true });
  main.addEventListener("touchend", async () => {
    if (y0 == null) return;
    const go = dy > 90; y0 = null;
    if (go){ ind.classList.add("spin"); ind.style.transform = ""; try { await doRefresh(); } catch {} }
    ind.classList.remove("spin", "ready"); ind.style.opacity = 0; ind.style.transform = "";
  });
})();
S.tab = "oggi"; S.league = "all"; S.day = 0; S.aoOff = 0;   // ogni apertura parte dalle partite di oggi
renderRail(); renderTabs(); render(); ensureLogos();
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
</script>
</body>
</html>
